# Architecture §32: every pull request runs install → lint → type check → unit
# tests → integration tests → build. Production deployment must require these.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: runtruck
          POSTGRES_PASSWORD: runtruck_ci
          POSTGRES_DB: runtruck_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U runtruck -d runtruck_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      NODE_ENV: test
      # CI-only throwaway credentials for the service containers above.
      DATABASE_URL: postgres://runtruck:runtruck_ci@localhost:5432/runtruck_test
      TEST_DATABASE_URL: postgres://runtruck:runtruck_ci@localhost:5432/runtruck_test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: runtruck-documents
      S3_ACCESS_KEY_ID: runtruck
      S3_SECRET_ACCESS_KEY: runtruck_ci_secret
      S3_FORCE_PATH_STYLE: 'true'
      API_ORIGIN: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start object storage (SeaweedFS S3)
        run: |
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"runtruck","secretKey":"runtruck_ci_secret"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 9000:8333 -v /tmp/s3.json:/etc/seaweedfs/s3.json:ro \
            chrislusf/seaweedfs:4.48 server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do curl -sf http://localhost:9000/healthz && break; sleep 1; done
          docker run --rm --network host -e AWS_ACCESS_KEY_ID=runtruck -e AWS_SECRET_ACCESS_KEY=runtruck_ci_secret \
            -e AWS_DEFAULT_REGION=us-east-1 amazon/aws-cli:2.34.0 --endpoint-url http://localhost:9000 \
            s3api create-bucket --bucket runtruck-documents-test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @runtruck/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          E2E_DATABASE_URL: postgres://runtruck:runtruck_ci@localhost:5432/runtruck_e2e
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
