# Local development infrastructure (architecture §3, §24, §28): PostgreSQL is the
# source of truth, Redis backs BullMQ queues and rate limiting. Development only —
# these credentials are throwaway local values, never staging/production ones (§33, §34).
name: runtruck

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runtruck
      POSTGRES_PASSWORD: runtruck_dev
      POSTGRES_DB: runtruck
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runtruck -d runtruck']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for load documents (architecture §21).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: runtruck
      MINIO_ROOT_PASSWORD: runtruck_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the private documents buckets (dev + test), then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 runtruck runtruck_dev_secret &&
      mc mb --ignore-existing local/runtruck-documents &&
      mc mb --ignore-existing local/runtruck-documents-test &&
      mc anonymous set none local/runtruck-documents &&
      mc anonymous set none local/runtruck-documents-test
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
