# Local development infrastructure (architecture §3, §24, §28): PostgreSQL is the
# source of truth, Redis backs BullMQ queues and rate limiting. Development only —
# these credentials are throwaway local values, never staging/production ones (§33, §34).
name: runtruck

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: runtruck
      POSTGRES_PASSWORD: runtruck_dev
      POSTGRES_DB: runtruck
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runtruck -d runtruck']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
